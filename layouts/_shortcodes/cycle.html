<div class="pm-panel" hidden aria-live="polite">

<p class="pm-where"></p>
<h3 class="pm-name"></h3>
<p class="pm-text"></p>
</div>
<div class="pm-cycle-list">
{{ .Inner | .Page.RenderString (dict "display" "block") }}
</div>
<footer class="pm-credit">Based on David Schnarch's comfort and growth cycle.</footer>
<script>
(() => {
  const root = document.currentScript.closest(".pm-cycle");
  const pills = [...root.querySelectorAll(".pm-stage")];
  const items = [...root.querySelectorAll(".pm-cycle-list li")];
  const panel = root.querySelector(".pm-panel");
  const zones = { comfort: "Comfort loop", growth: "Growth ring", exit: "A way out" };
  if (items.length !== pills.length) return;
  let at = 0;
  const show = n => {
    at = (n + pills.length) % pills.length;
    pills.forEach((p, k) => { p.classList.toggle("pm-on", k === at); p.setAttribute("aria-pressed", k === at); });
    const li = items[at].cloneNode(true), name = li.querySelector("strong");
    panel.dataset.zone = pills[at].dataset.zone;
    root.querySelector(".pm-where").textContent = zones[pills[at].dataset.zone];
    root.querySelector(".pm-count").textContent = (at + 1) + " of " + pills.length;
    root.querySelector(".pm-name").textContent = name.textContent;
    name.remove();
    root.querySelector(".pm-text").textContent = li.textContent.trim();
    pills.forEach(p => p.classList.toggle("pm-next", root.classList.contains("pm-fresh") && +p.dataset.i === (at + 1) % pills.length));
  };
  const touch = () => root.classList.remove("pm-fresh");
  pills.forEach((p, k) => {
    p.addEventListener("click", () => { touch(); show(k); });
    p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); touch(); show(k); } });
  });
  root.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => { touch(); show(at + +b.dataset.step); }));
  root.querySelector(".pm-cycle-list").hidden = true;
  root.querySelector(".pm-hint").hidden = false;
  panel.hidden = false;
  root.classList.add("pm-fresh");
  show(0);
})();
</script>
</article>
