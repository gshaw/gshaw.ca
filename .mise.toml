[tools]
# Workers Builds reads HUGO_VERSION from the Worker's two build triggers: change
# all three together. See AGENTS.md.
hugo = "0.167.0"
node = "24.4.1"
"npm:cspell" = "9.1.5"
"npm:markdownlint-cli2" = "0.22.1"
lychee = "0.24.2"
# Workers Builds deploys with this version too (npx wrangler@…).
"npm:wrangler" = "4.143.1"

[tasks.dev]
description = "Serve the site at https://gs.dev.gshaw.ca, for the Mac and the phone over the tailnet (Caddy on lagoon forwards to :4030)"
run = "hugo server --port 4030 --bind 127.0.0.1 --baseURL https://gs.dev.gshaw.ca/ --appendPort=false --liveReloadPort 443 --openBrowser"

[tasks.build]
run = "hugo --quiet --cleanDestinationDir --panicOnWarning"

[tasks.spell]
run = "cspell lint --no-progress ."

[tasks.markdownlint]
run = """
out=$(markdownlint-cli2 '**/*.md' 2>&1) && echo "Markdown lint passed" || { echo "$out"; exit 1; }
"""

# Internal links and images only. External sites rate-limit and flake; check
# them by hand with `lychee public` when it matters.
[tasks.links]
depends = ["build"]
run = "lychee --offline --no-progress --root-dir \"$PWD/public\" 'public/**/*.html'"

[tasks.check]
depends = ["spell", "markdownlint", "links"]

# Run by deploy once Workers Builds has deployed main.
[tasks.verify]
run = """
set -e
curl -fsS https://gshaw.ca/ | grep -q "<title>Gerry Shaw"
echo "gshaw.ca is up"
test "$(curl -s -o /dev/null -w '%{http_code}' https://gshaw.ca/no-such-page/)" = 404
echo "404 page works"
"""

# Changes land through a squash-merged PR, and Workers Builds deploys main on its own.
# This confirms it: main must match origin/main, then check, wait for the build, verify.
# See Workshop's Tooling/deploy.md.
[tasks.deploy]
run = [
  "scripts/deploy-guard.sh",
  "mise run check",
  "scripts/build-status.sh --wait",
  "mise run verify",
  'echo "✅ $(git rev-parse --short HEAD) is live on gshaw.ca and verified."',
]

[tasks.deploy-status]
run = "scripts/build-status.sh"
