# cspell:ignore robotstxt
baseURL = "https://gshaw.ca/"
title = "Gerry Shaw"
disableHugoGeneratorInject = true
# No sitemap, robots.txt or feed: see "Deliberate decisions" in AGENTS.md.
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotstxt"]

[params]
description = "Gerry Shaw is an independent software developer in Vancouver, Canada."
icon = "/gerry.jpg"
start_year = 2013
[params.author]
name = "Gerry Shaw"
email = "gerry_shaw@yahoo.com"

[markup.goldmark.renderer]
unsafe = true # raw HTML in Markdown: the home page's header picture


# Recipe photos live once, in static/recipes/: published as they are (for
# og:image and the home page) and also read as resources, so the recipe
# layouts can resize them.
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "static/recipes"
target = "assets/recipes"
